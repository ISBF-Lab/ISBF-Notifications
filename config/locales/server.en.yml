  site_settings:
    isbf_notifications_enabled: "Enable grouped ISBF notifications."
    isbf_device_push_liked: "Send a push when a post receives a like. Applies to iPhone, Google Web Push, and Android direct only; in-site notifications and email are unchanged."
    isbf_device_push_replied: "Send a push for replies and reactions to a post. Applies to iPhone, Google Web Push, and Android direct only; in-site notifications and email are unchanged."
    isbf_device_push_mentioned: "Send a push when a post mentions the user or one of their groups. Applies to iPhone, Google Web Push, and Android direct only; in-site notifications and email are unchanged."
    isbf_device_push_following: "Send a push for new topics or replies in watched topics, categories, or tags. Applies to iPhone, Google Web Push, and Android direct only; in-site notifications and email are unchanged."
    isbf_device_push_private_message: "Send a push for new personal messages and replies to personal messages. Applies to iPhone, Google Web Push, and Android direct only; in-site notifications and email are unchanged."
    isbf_device_push_chat_message: "Send a push for direct messages or new activity in followed chat channels. Applies to iPhone, Google Web Push, and Android direct only; in-site notifications and email are unchanged."
    isbf_device_push_chat_mention: "Send a push when the user is mentioned in chat. Applies to iPhone, Google Web Push, and Android direct only; in-site notifications and email are unchanged."
    isbf_device_push_topic_reminder: "Send a push when a topic reminder is due. Applies to iPhone, Google Web Push, and Android direct only; in-site notifications and email are unchanged."
    isbf_device_push_scheduled_event: "Send scheduled personal, official event, and registration deadline reminders. Existing reminder times apply. Items delivered through a calendar subscription are not pushed again. Applies to iPhone, Google Web Push, and Android direct only; in-site notifications and email are unchanged."
    isbf_device_push_calendar_changed: "Send a push when an item in the user’s schedule changes or is cancelled. Applies to iPhone, Google Web Push, and Android direct only; in-site notifications and email are unchanged."
