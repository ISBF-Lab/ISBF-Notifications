name: Discourse plugin checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: notifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin checks (${{ matrix.baseline }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - baseline: integration
            ref: 1ede539a7c6c4c28f222e637fa3f54c810c7e895
          - baseline: published-core
            ref: 132cc95d043db01251eedf9c93b3927cd5ffee91
    runs-on: ubuntu-latest
    container: discourse/discourse_test@sha256:94eca5318fed6171264b95204914de76a113c305cebb72d9fa9527e2c4496494
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: discourse
    env:
      RAILS_ENV: test
      RAILS_DB: isbf_notifications_test
      PGUSER: discourse
      PGPASSWORD: discourse
      LOAD_PLUGINS: 1
      DISCOURSE_DISABLE_EMAILS: "yes"
      DISCOURSE_SMTP_ADDRESS: ""
      DISCOURSE_SMTP_PASSWORD: ""
      DISCOURSE_REFRESH_MAXMIND_DB_DURING_PRECOMPILE_DAYS: 0

    steps:
      - uses: actions/checkout@v6
        with:
          repository: ISBF-Lab/ISBFweb
          ref: ${{ matrix.ref }}
          path: discourse
          fetch-depth: 1

      - name: Preserve the bundled plugin before installing the candidate
        run: |
          test -d plugins/isbf-notifications
          test ! -e "$RUNNER_TEMP/isbf-notifications-baseline"
          mv plugins/isbf-notifications "$RUNNER_TEMP/isbf-notifications-baseline"

      - uses: actions/checkout@v6
        with:
          path: discourse/plugins/isbf-notifications
          fetch-depth: 1

      - uses: actions/checkout@v6
        with:
          repository: ISBF-Lab/ISBF-Calendar
          ref: 68ed219ba8688d78dfbd1c032eeb2bc904ad229a
          path: calendar-plugin
          fetch-depth: 1
          persist-credentials: false

      - name: Load the published calendar plugin without changing dependency snapshots
        run: |
          test -d plugins/isbf-calendar
          test ! -e "$RUNNER_TEMP/isbf-calendar-baseline"
          mv plugins/isbf-calendar "$RUNNER_TEMP/isbf-calendar-baseline"
          cp -a ../calendar-plugin plugins/isbf-calendar

      - name: Cache Ruby dependencies
        uses: actions/cache@v5
        with:
          path: discourse/vendor/bundle
          key: notifications-gems-${{ runner.os }}-${{ hashFiles('discourse/Gemfile.lock') }}

      - name: Install locked dependencies
        run: |
          bundle config --local path vendor/bundle
          bundle config --local deployment true
          bundle config --local without ''
          bundle config --local with development:test
          bundle install --jobs 4
          pnpm install --frozen-lockfile

      - name: Start isolated services
        run: |
          redis-server /etc/redis/redis.conf &
          chown -R postgres /var/run/postgresql
          sudo -E -u postgres script/start_test_db.rb
          sudo -u postgres psql -c "CREATE ROLE $PGUSER LOGIN SUPERUSER PASSWORD '$PGPASSWORD';"

      - name: Prepare the test database
        run: |
          bin/rake db:create
          bin/rake db:migrate

      - name: Lint the candidate plugin
        run: bin/lint plugins/isbf-notifications

      - name: Run plugin backend tests
        run: bin/rspec plugins/isbf-notifications/spec

      - name: Build the frontend
        env:
          EMBER_ENV: development
          DISCOURSE_DOWNLOAD_PRE_BUILT_ASSETS: "0"
        run: script/assemble_ember_build.rb

      - name: Run plugin frontend tests
        env:
          QUNIT_REUSE_BUILD: 1
        run: bin/rake plugin:qunit['isbf-notifications','1200000']

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: notifications-${{ matrix.baseline }}-${{ github.run_id }}
          path: |
            discourse/log/test.log
            discourse/tmp/rspec*
            discourse/tmp/qunit*
          if-no-files-found: ignore
          retention-days: 14
